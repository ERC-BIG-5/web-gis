# web-gis under /web-gis/. Include from inside your existing server {} block:
#   include /home/ubuntu/projects/web-gis/deploy/nginx_web-gis.conf;
# Used straight from the repo, no copy. Requires:
#   - nginx_web-gis-common.conf next to this file (shared proxy/header settings)
#   - deploy/nginx_web-gis-ratelimit.conf copied to /etc/nginx/conf.d/ (limit_req zone;
#     must sit at http{} level, so it cannot be included from here)
# After a git pull that touches these files: sudo nginx -t && sudo systemctl reload nginx
# To change the prefix, replace /web-gis below and in the common file.

location = /web-gis {
    return 301 /web-gis/;
}

# Write / session endpoints: generous per-IP rate limit. A whole workshop room
# may sit behind one IP, so this only stops scripted abuse, not people.
location ~ ^/web-gis/(session|evaluate)(/|$) {
    limit_req zone=webgis_write burst=40 nodelay;
    limit_req_status 429;
    rewrite ^/web-gis/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8888;   # must match PORT in server/.env
    include /home/ubuntu/projects/web-gis/deploy/nginx_web-gis-common.conf;
}

location /web-gis/ {
    # Trailing slash strips "/web-gis": /web-gis/locations -> /locations on the app.
    proxy_pass http://127.0.0.1:8888/;   # must match PORT in server/.env
    include /home/ubuntu/projects/web-gis/deploy/nginx_web-gis-common.conf;

    # /geo-dataset returns multi-MB GeoJSON; FastAPI does not gzip it.
    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css;
    gzip_min_length 1024;

    proxy_read_timeout 120s;
}
