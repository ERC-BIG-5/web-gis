# Copy to /etc/nginx/conf.d/web-gis-ratelimit.conf (http context).
# Per-IP budget for the web-gis write endpoints; used by nginx_web-gis.conf.
# 10 requests/second sustained plus a burst of 40 is far above human use,
# even for a room of participants sharing one IP.
limit_req_zone $binary_remote_addr zone=webgis_write:10m rate=10r/s;
limit_req_log_level warn;
