[project]
name = "webgis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "pillow>=12.2.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.27.2",
]

[project.scripts]
webgis = "webgis.cli:app"
webgis-server = "webgis.main:run"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
